<!DOCTYPE html>

<meta charset="UTF-8">

<title>Game</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.game {
    width: 100vw;
    height: 100vh;
    background: #FE6D1A;
    display: flex;
    flex-direction: column;
}

.scene {
    position: relative;
    width: 100%;
    height: 65%;
    background: black;
    overflow: hidden;
}

.background {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
    object-fit: cover;
    z-index: 1;
}

.character {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
    object-fit: contain;
    pointer-events: none;
    z-index: 2;
}

#character2 {
    z-index: 3;
}

#character3 {
    z-index: 4;
}

.scene-image {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
    object-fit: contain;
    pointer-events: none;
    z-index: 10;
}

.fullscreen {
    position: absolute;
    top: 12px;
    right: 12px;
    border: none;
    background: rgba(254,109,26,0.85);
    color: #1F3271;
    padding: 7px 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
}

.dialogue {
    position: relative;
    width: 100%;
    height: 35%;
    background: #FE6D1A;
    border-top: 2px solid #1F3271;
    padding: 25px 35px;
    cursor: pointer;
}

.name {
    color: #1F3271;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.text {
    color: #1F3271;
    font-size: 18px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.japanese {
    color: red;
}

.menu-button {
    position: absolute;
    top: 10px;
    right: 15px;
    border: none;
    background: none;
    color: #1F3271;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    z-index: 20;
}

.menu {
    display: none;
    position: absolute;
    right: 15px;
    top: 45px;
    background: #FE6D1A;
    border: 2px solid #1F3271;
    padding: 8px;
    z-index: 30;
}

.menu button {
    display: block;
    width: 100%;
    padding: 9px 12px;
    margin: 3px 0;
    border: none;
    background: #FE6D1A;
    color: #1F3271;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.menu button:hover {
    background: #1F3271;
    color: #FE6D1A;
}

@media (max-width: 600px) {

    .scene {
        height: 60%;
    }

    .dialogue {
        height: 40%;
        padding: 20px;
    }

    .text {
        font-size: 16px;
    }

    .name {
        font-size: 16px;
    }

}

</style>
</head>

const c1 = document.getElementById("character1");
const c2 = document.getElementById("character2");
const c3 = document.getElementById("character3");
const sceneImage = document.getElementById("sceneImage");

const nameBox = document.getElementById("name");
const textBox = document.getElementById("text");

function stopAllMusic() {
    document.getElementById("sayonara").pause();
    document.getElementById("static").pause();

    document.getElementById("sayonara").currentTime = 0;
    document.getElementById("static").currentTime = 0;
}

function changeMusic(musicName) {

    if (currentMusic === musicName) return;

    stopAllMusic();

    currentMusic = musicName;

    if (musicName !== "") {

        const music = document.getElementById(musicName);

        if (music) {

            music.play().catch(() => {});

        }

    }
}

function showDialogue() {

    const d = dialogues[currentDialogue];

    bg.src = d.background;

    c1.src = d.characters[0] || "";
    c2.src = d.characters[1] || "";
    c3.src = d.characters[2] || "";

    nameBox.textContent = d.name;

    if (d.japanese) {

        textBox.innerHTML =
            "<span class='japanese'>" +
            d.text +
            "</span>";

    } else {

        textBox.textContent = d.text;

    }

    if (d.sceneImage) {

        sceneImage.src = d.sceneImage;
        sceneImage.style.display = "block";

    } else {

        sceneImage.style.display = "none";

    }

    changeMusic(d.music);
}

function nextDialogue() {

    if (currentDialogue < dialogues.length - 1) {

        currentDialogue++;

        showDialogue();

    }

}

document.getElementById("dialogue")
.addEventListener("click", nextDialogue);

document.getElementById("menuButton")
.addEventListener("click", function(event){

    event.stopPropagation();

    const menu = document.getElementById("menu");

    if(menu.style.display === "block"){
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }

});

document.getElementById("saveButton")
.addEventListener("click", function(event){

    event.stopPropagation();

    localStorage.setItem(
        "saveData",
        currentDialogue
    );

});

document.getElementById("loadButton")
.addEventListener("click", function(event){

    event.stopPropagation();

    const save =
        localStorage.getItem("saveData");

    if(save !== null){

        currentDialogue =
            parseInt(save);

        showDialogue();

    }

});

document.getElementById("fullscreenButton")
.addEventListener("click", function(event){

    event.stopPropagation();

    if(!document.fullscreenElement){

        document.documentElement
        .requestFullscreen();

    } else {

        document.exitFullscreen();

    }

});

showDialogue();

</script>
</body>
</html>
