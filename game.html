<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Вся игра */
        .game {
            width: 100vw;
            height: 100vh;
            background: #FE6D1A;

            display: flex;
            flex-direction: column;

            cursor: pointer;
        }

        /* Область сцены */
        .scene {
            position: relative;

            width: 100%;
            height: 65%;

            background: black;

            overflow: hidden;
        }

        /* Фон */
        .background {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            left: 0;
            top: 0;

            z-index: 1;
        }

        /* Персонажи */
        .character {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: contain;

            left: 0;
            top: 0;

            pointer-events: none;

            z-index: 2;
        }

        /* Дополнительная картинка сцены
           Например hug.png, remember.png, end1.png и т.д. */
        .scene-image {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: contain;

            left: 0;
            top: 0;

            pointer-events: none;

            z-index: 10;
        }

        /* Полный экран */
        .fullscreen {
            position: absolute;

            top: 12px;
            right: 12px;

            border: none;
            background: rgba(254, 109, 26, 0.85);

            color: #1F3271;

            padding: 7px 10px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            z-index: 20;
        }

        /* Диалог */
        .dialogue {
            position: relative;

            width: 100%;
            height: 35%;

            background: #FE6D1A;

            border-top: 2px solid #1F3271;

            padding: 25px 35px;
        }

        /* Имя */
        .name {
            color: #1F3271;

            font-size: 18px;
            font-weight: bold;

            margin-bottom: 15px;
        }

        /* Текст */
        .text {
            color: #1F3271;

            font-size: 18px;
            line-height: 1.6;

            white-space: pre-wrap;
        }

        /* Японский текст */
        .japanese {
            color: red;
        }

        /* Кнопка меню */
        .menu-button {
            position: absolute;

            top: 10px;
            right: 15px;

            border: none;
            background: none;

            color: #1F3271;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            z-index: 20;
        }

        /* Меню */
        .menu {
            display: none;

            position: absolute;

            right: 15px;
            top: 45px;

            background: #FE6D1A;

            border: 2px solid #1F3271;

            padding: 8px;

            z-index: 30;
        }

        /* Кнопки меню */
        .menu button {
            display: block;

            width: 100%;

            padding: 9px 12px;

            margin: 3px 0;

            border: none;

            background: #FE6D1A;

            color: #1F3271;

            text-align: left;

            cursor: pointer;

            font-size: 14px;
            font-weight: bold;
        }

        .menu button:hover {
            background: #1F3271;
            color: #FE6D1A;
        }

        /* Маленькие экраны */
        @media (max-width: 600px) {

            .scene {
                height: 60%;
            }

            .dialogue {
                height: 40%;
                padding: 20px;
            }

            .text {
                font-size: 16px;
            }

            .name {
                font-size: 16px;
            }
        }
    </style>
</head>
