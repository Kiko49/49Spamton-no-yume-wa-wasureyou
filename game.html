<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Вся игровая область */
        .game {
            width: 100vw;
            height: 100vh;
            background: #FE6D1A;

            display: flex;
            flex-direction: column;

            cursor: pointer;
        }

        /* Область сцены */
        .scene {
            position: relative;

            width: 100%;
            height: 65%;

            background: black;

            overflow: hidden;
        }

        /* Фон */
        .background {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            left: 0;
            top: 0;
        }

        /* Персонаж */
        .character {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: contain;

            left: 0;
            top: 0;

            pointer-events: none;
        }

        /* Кнопка полноэкранного режима */
        .fullscreen {
            position: absolute;

            top: 12px;
            right: 12px;

            border: none;
            background: rgba(254, 109, 26, 0.85);

            color: #1F3271;

            padding: 7px 10px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            z-index: 5;
        }

        /* Диалоговое окно */
        .dialogue {
            position: relative;

            width: 100%;
            height: 35%;

            background: #FE6D1A;

            border-top: 2px solid #1F3271;

            padding: 25px 35px;
        }

        /* Имя персонажа */
        .name {
            color: #1F3271;

            font-size: 18px;
            font-weight: bold;

            margin-bottom: 15px;
        }

        /* Текст диалога */
        .text {
            color: #1F3271;

            font-size: 18px;
            line-height: 1.6;

            white-space: pre-wrap;
        }

        /* Японские реплики */
        .japanese {
            color: red;
        }

        /* Кнопка меню */
        .menu-button {
            position: absolute;

            top: 10px;
            right: 15px;

            border: none;
            background: none;

            color: #1F3271;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            z-index: 20;
        }

        /* Меню */
        .menu {
            display: none;

            position: absolute;

            right: 15px;
            top: 45px;

            background: #FE6D1A;

            border: 2px solid #1F3271;

            padding: 8px;

            z-index: 30;
        }

        /* Кнопки меню */
        .menu button {
            display: block;

            width: 100%;

            padding: 9px 12px;

            margin: 3px 0;

            border: none;

            background: #FE6D1A;

            color: #1F3271;

            text-align: left;

            cursor: pointer;

            font-size: 14px;
            font-weight: bold;
        }

        .menu button:hover {
            background: #1F3271;
            color: #FE6D1A;
        }

        /* Маленькие экраны */
        @media (max-width: 600px) {

            .scene {
                height: 60%;
            }

            .dialogue {
                height: 40%;
                padding: 20px;
            }

            .text {
                font-size: 16px;
            }

            .name {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="game" id="game">

        <!-- СЦЕНА -->
        <div class="scene">

            <!-- Фон -->
            <img
                id="background"
                class="background"
                src="images/black.png"
                alt=""
            >

            <!-- Персонаж -->
            <img
                id="character"
                class="character"
                src=""
                alt=""
            >

            <!-- Полный экран -->
            <button
                class="fullscreen"
                onclick="toggleFullscreen(event)"
            >
                ⛶
            </button>

        </div>


        <!-- ДИАЛОГ -->
        <div
            class="dialogue"
            onclick="nextDialogue(event)"
        >

            <!-- Кнопка меню -->
            <button
                class="menu-button"
                onclick="toggleMenu(event)"
            >
                ☰
            </button>


            <!-- Меню -->
            <div
                class="menu"
                id="menu"
            >

                <button onclick="saveGame(event)">
                    ゲームを保存する
                </button>

                <button onclick="loadGame(event)">
                    セーブデータをロードする
                </button>

            </div>


            <!-- Имя персонажа -->
            <div
                class="name"
                id="name"
            >
                ???
            </div>


            <!-- Текст -->
            <div
                class="text"
                id="text"
            >
                I think I'll introduce myself for the first time to the voices in my head.
            </div>

        </div>

    </div>


    <script>

        /*
        ==========================================
        СЦЕНАРИЙ
        ==========================================
        */

        const dialogues = [

            {
                name: "???",
                text: "I think I'll introduce myself for the first time to the voices in my head.",
                background: "images/black.png",
                character: "",
                japanese: false
            },

            {
                name: "Tihun",
                text: "My name is Tihun, and I have a very important mission right now!",
                background: "images/black.png",
                character: "",
                japanese: false
            },

            {
                name: "Tihun",
                text: "I'm going to tell a friend that the person he adored died.",
                background: "images/black.png",
                character: "",
                japanese: false
            },

            {
                name: "Tihun",
                text: "It's terrible, but it's the least I can do for him...",
                background: "images/black.png",
                character: "",
                japanese: false
            },

            {
                name: "Tihun",
                text: "This is my poor, unfortunate friend who will face this terrible truth! His name is Shelbi...",
                background: "images/backgroundroom.png",
                character: "images/shelbih.png",
                japanese: false
            }

        ];


        let currentDialogue = 0;


        /*
        ==========================================
        ПОКАЗ РЕПЛИКИ
        ==========================================
        */

        function showDialogue() {

            const dialogue = dialogues[currentDialogue];

            const nameElement =
                document.getElementById("name");

            const textElement =
                document.getElementById("text");

            const backgroundElement =
                document.getElementById("background");

            const characterElement =
                document.getElementById("character");


            /*
            Имя
            */

            nameElement.textContent =
                dialogue.name;


            /*
            Текст
            */

            textElement.textContent =
                dialogue.text;


            /*
            Цвет японского текста
            */

            if (dialogue.japanese) {

                textElement.classList.add("japanese");

            } else {

                textElement.classList.remove("japanese");

            }


            /*
            Фон
            */

            backgroundElement.src =
                dialogue.background;


            /*
            Персонаж
            */

            if (dialogue.character) {

                characterElement.src =
                    dialogue.character;

                characterElement.style.display =
                    "block";

            } else {

                characterElement.src = "";

                characterElement.style.display =
                    "none";

            }

        }


        /*
        ==========================================
        СЛЕДУЮЩАЯ РЕПЛИКА
        ==========================================
        */

        function nextDialogue(event) {

            /*
            Не переключать реплику,
            если нажата кнопка меню
            или само меню.
            */

            if (
                event.target.closest(".menu-button") ||
                event.target.closest(".menu")
            ) {
                return;
            }


            if (
                currentDialogue <
                dialogues.length - 1
            ) {

                currentDialogue++;

                showDialogue();

            }

        }


        /*
        ==========================================
        МЕНЮ
        ==========================================
        */

        function toggleMenu(event) {

            event.stopPropagation();

            const menu =
                document.getElementById("menu");


            if (
                menu.style.display === "block"
            ) {

                menu.style.display = "none";

            } else {

                menu.style.display = "block";

            }

        }


        /*
        ==========================================
        СОХРАНЕНИЕ
        ==========================================
        */

        function saveGame(event) {

            event.stopPropagation();

            localStorage.setItem(
                "novelSave",
                currentDialogue
            );

            alert("ゲームを保存しました。");

        }


        /*
        ==========================================
        ЗАГРУЗКА
        ==========================================
        */

        function loadGame(event) {

            event.stopPropagation();

            const saved =
                localStorage.getItem("novelSave");


            if (saved !== null) {

                currentDialogue =
                    Number(saved);

                showDialogue();

                alert(
                    "セーブデータをロードしました。"
                );

            } else {

                alert(
                    "セーブデータがありません。"
                );

            }

        }


        /*
        ==========================================
        ПОЛНЫЙ ЭКРАН
        ==========================================
        */

        function toggleFullscreen(event) {

            event.stopPropagation();

            const game =
                document.getElementById("game");


            if (!document.fullscreenElement) {

                game.requestFullscreen();

            } else {

                document.exitFullscreen();

            }

        }


        /*
        ==========================================
        ЗАПУСК
        ==========================================
        */

        showDialogue();

    </script>

</body>
</html>
