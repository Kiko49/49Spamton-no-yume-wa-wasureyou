<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Вся игра */
        .game {
            width: 100vw;
            height: 100vh;
            background: white;

            display: flex;
            flex-direction: column;

            cursor: pointer;
        }

        /* Область изображения */
        .scene {
            position: relative;

            width: 100%;
            height: 65%;

            background: #eeeeee;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /*
        Здесь позже будет твоя картинка.

        Сейчас вместо неё просто написано IMAGE.
        */

        .scene-placeholder {
            color: #999;
            font-size: 20px;
        }

        /* Кнопка полноэкранного режима */
        .fullscreen {
            position: absolute;

            top: 12px;
            right: 12px;

            border: none;
            background: rgba(255, 255, 255, 0.75);

            padding: 7px 10px;

            font-size: 18px;
            cursor: pointer;

            z-index: 5;
        }

        /* Диалоговое окно */
        .dialogue {
            position: relative;

            width: 100%;
            height: 35%;

            background: white;

            border-top: 1px solid #cccccc;

            padding: 25px 35px;
        }

        /* Имя персонажа */
        .name {
            font-size: 18px;
            font-weight: bold;

            margin-bottom: 15px;
        }

        /* Текст */
        .text {
            font-size: 18px;
            line-height: 1.6;

            white-space: pre-wrap;
        }

        /* Японские реплики */
        .japanese {
            color: red;
        }

        /* Кнопка меню */
        .menu-button {
            position: absolute;

            top: 10px;
            right: 15px;

            border: none;
            background: none;

            font-size: 22px;

            cursor: pointer;
        }

        /* Меню сохранения */
        .menu {
            display: none;

            position: absolute;

            right: 15px;
            top: 45px;

            background: white;

            border: 1px solid #999;

            padding: 10px;

            z-index: 10;
        }

        .menu button {
            display: block;

            width: 100%;

            padding: 8px 12px;

            margin: 3px 0;

            border: none;

            background: white;

            text-align: left;

            cursor: pointer;

            font-size: 14px;
        }

        .menu button:hover {
            background: #eeeeee;
        }

        /* Для маленьких экранов */
        @media (max-width: 600px) {

            .scene {
                height: 60%;
            }

            .dialogue {
                height: 40%;
                padding: 20px;
            }

            .text {
                font-size: 16px;
            }

            .name {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="game" id="game">

        <!-- ИЗОБРАЖЕНИЕ -->
        <div class="scene">

            <div class="scene-placeholder">
                IMAGE
            </div>

            <!-- Полный экран -->
            <button
                class="fullscreen"
                onclick="toggleFullscreen(event)"
            >
                ⛶
            </button>

        </div>


        <!-- ДИАЛОГ -->
        <div
            class="dialogue"
            onclick="nextDialogue(event)"
        >

            <!-- Кнопка меню -->
            <button
                class="menu-button"
                onclick="toggleMenu(event)"
            >
                ☰
            </button>


            <!-- Меню -->
            <div
                class="menu"
                id="menu"
            >

                <button onclick="saveGame(event)">
                    ゲームを保存する
                </button>

                <button onclick="loadGame(event)">
                    セーブデータをロードする
                </button>

            </div>


            <!-- Имя -->
            <div class="name">
                CHARACTER
            </div>


            <!-- Реплика -->
            <div class="text" id="text">
                Hello. This is the beginning of the story.
            </div>

        </div>

    </div>


    <script>

        /*
        ==========================================
        ДИАЛОГИ
        ==========================================
        */

        const dialogues = [

            {
                name: "CHARACTER",
                text: "Hello. This is the beginning of the story.",
                japanese: false
            },

            {
                name: "CHARACTER",
                text: "This is the second line.",
                japanese: false
            },

            {
                name: "CHARACTER",
                text: "こんにちは。",
                japanese: true
            },

            {
                name: "CHARACTER",
                text: "And this is another line.",
                japanese: false
            }

        ];


        let currentDialogue = 0;


        /*
        ==========================================
        ПОКАЗ РЕПЛИКИ
        ==========================================
        */

        function showDialogue() {

            const dialogue = dialogues[currentDialogue];

            const nameElement = document.querySelector(".name");
            const textElement = document.getElementById("text");

            nameElement.textContent = dialogue.name;

            textElement.textContent = dialogue.text;


            if (dialogue.japanese) {

                textElement.classList.add("japanese");

            } else {

                textElement.classList.remove("japanese");

            }
        }


        /*
        ==========================================
        СЛЕДУЮЩАЯ РЕПЛИКА
        ==========================================
        */

        function nextDialogue(event) {

            /*
            Если нажали на кнопку меню,
            не переключаем реплику.
            */

            if (
                event.target.closest(".menu-button") ||
                event.target.closest(".menu")
            ) {
                return;
            }


            if (currentDialogue < dialogues.length - 1) {

                currentDialogue++;

                showDialogue();

            }

        }


        /*
        ==========================================
        ОТКРЫТЬ / ЗАКРЫТЬ МЕНЮ
        ==========================================
        */

        function toggleMenu(event) {

            event.stopPropagation();

            const menu = document.getElementById("menu");

            if (menu.style.display === "block") {

                menu.style.display = "none";

            } else {

                menu.style.display = "block";

            }
        }


        /*
        ==========================================
        СОХРАНЕНИЕ
        ==========================================
        */

        function saveGame(event) {

            event.stopPropagation();

            localStorage.setItem(
                "novelSave",
                currentDialogue
            );

            alert("ゲームを保存しました。");

        }


        /*
        ==========================================
        ЗАГРУЗКА
        ==========================================
        */

        function loadGame(event) {

            event.stopPropagation();

            const saved = localStorage.getItem("novelSave");


            if (saved !== null) {

                currentDialogue = Number(saved);

                showDialogue();

                alert("セーブデータをロードしました。");

            } else {

                alert("セーブデータがありません。");

            }

        }


        /*
        ==========================================
        ПОЛНЫЙ ЭКРАН
        ==========================================
        */

        function toggleFullscreen(event) {

            event.stopPropagation();

            const game = document.getElementById("game");


            if (!document.fullscreenElement) {

                game.requestFullscreen();

            } else {

                document.exitFullscreen();

            }

        }


        /*
        ==========================================
        ЗАПУСК
        ==========================================
        */

        showDialogue();

    </script>

</body>
</html>
